name: CI

# Runs on every push to main, dev and the web/** integration branches, and on every PR
# into main.
# - test: unit tests + lint + typecheck for the desktop app and the web app (web/),
#   plus the web app's production build. This is the status check required by main's
#   branch protection: main only accepts PRs whose CI is green. Mirrors the local
#   pre-push hook (.husky/pre-push) so the cloud gate and the developer's local gate
#   run the same suite. It also checks that the generated artifacts are current: the
#   golden fixtures and the API client types (web/src/api/schema.d.ts, from
#   crates/server/openapi.json).
# - read-api-budget: the strict §6.2 list/detail budgets, release build and
#   20k synthetic posts, on a runner without concurrent unit tests.
# - rust: the Cargo workspace (crates/): rustfmt, clippy with warnings as errors, tests
#   and cargo-deny, on the toolchain pinned in rust-toolchain.toml. Its tests include
#   the check that crates/server/openapi.json matches the Rust routes.
#   The size-limit step (P1-08, plan §6.2) enforces the web app's initial JS budget
#   (≤220 KB gzip, .size-limit.json) against the build the previous step just produced.
# - ssrf: the SSRF suite (P4-02, plan §6.1). Builds the egress proxy image, brings up
#   deploy/compose.test.yml's egress, test resolver and fixtures, and runs
#   crates/server/tests/ssrf.rs through the API's real outbound client against the real
#   Smokescreen config; every probe in deploy/egress/ssrf/probes.json is refused and the
#   positive controls pass. The suite's runtime is printed (--nocapture).
# - web-e2e (P1-21, plan §6.1): the web Playwright suite against a mocked API
#   (web/playwright.config.ts, web/e2e/api.ts) — no server build, so it stays fast.
#   This is the web e2e gate: every behavior P1-02 through P2-07 added (gallery,
#   filters, bulk/trash, modal, folders, mobile viewports, the service worker, the
#   error boundary) runs here on every push and PR.
# - web-e2e-live (P1-21, plan §6.1): the same suite's real-server specs
#   (web/e2e/server/) — passkeys, re-auth, device approval, sessions, Jobs and the
#   write-to-SSE latency probe (§6.2) — none of which a mock can exercise, against a
#   release build of shelfy-server it compiles itself.
# - lighthouse (P1-21, plan §6.2): Lighthouse CI on the Gallery, mobile profile, with
#   a 6k-post `admin synth` library, against the LCP ≤2.5 s budget
#   (web/lighthouserc.json). `continue-on-error`: the P1 architecture is
#   client-rendered (no SSR), and Lighthouse's simulated slow-4G/4×-CPU profile pays
#   for every sequential round trip that costs (HTML → CSS/JS → `GET /posts` → the
#   first tile's image) before it ever reaches application code; closing that gap is
#   tracked as a follow-up, not blocking merges meanwhile. Scores are still recorded
#   on every run (job log + the uploaded report).

on:
  push:
    branches: [main, dev, 'web/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The synthetic in-page capture script suite must exercise Chromium;
      # an absent browser on this runner must not silently omit the tests.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:run
      - run: pnpm run web:build
      - run: pnpm run size-limit
      - run: pnpm exec tsx scripts/golden/run.ts --check
      - run: pnpm exec tsx scripts/api-client/generate.ts --check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Installs the channel, components and profile pinned in rust-toolchain.toml.
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: EmbarkStudios/cargo-deny-action@v2

  # §6.2 measures release server time on a 20k-post library. Give the strict
  # budget probe its own runner rather than timing alongside debug suites.
  read-api-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: Read API release budgets on a 20k-post library
        env:
          CARGO_INCREMENTAL: '0'
          RUST_TEST_THREADS: '1'
        run: cargo test --release -p shelfy-server --test read_api_budget --locked -- --nocapture

  ssrf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: Build the egress proxy image
        run: DOCKER_BUILDKIT=1 docker build -f deploy/docker/shelfy-egress.Dockerfile -t shelfy-egress:local .
      - name: Start the egress proxy, resolver and fixtures
        run: docker compose -f deploy/compose.test.yml -p shelfy-ssrf up -d --wait shelfy-ssrf-egress
      # Distroless carries no probe executable: compose only knows that the
      # proxy is running. Wait for its listener, fixture DNS and allowed HTTP
      # path to work together before running the full positive/negative suite.
      - name: Wait for an allowed request through the proxy
        run: |
          curl --fail --silent --show-error --noproxy '' \
            --proxy http://127.0.0.1:4750 --max-time 2 \
            --retry 10 --retry-connrefused --retry-all-errors --retry-delay 1 \
            http://allowed.fixture.test/ | grep -Fx 'shelfy ssrf fixture ok'
      - name: Run the SSRF suite against the real proxy
        env:
          SHELFY_SSRF_PROXY: http://127.0.0.1:4750
        run: cargo test -p shelfy-server --test ssrf --locked -- --nocapture
      - name: Proxy decisions (for the §3.7 log check)
        if: always()
        run: |
          docker compose -f deploy/compose.test.yml -p shelfy-ssrf ps -a
          docker compose -f deploy/compose.test.yml -p shelfy-ssrf logs shelfy-ssrf-resolver shelfy-ssrf-fixture shelfy-ssrf-egress
          for id in $(docker compose -f deploy/compose.test.yml -p shelfy-ssrf ps -a -q); do
            docker inspect --format '{{.Name}} {{json .State}}' "$id"
          done
      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose.test.yml -p shelfy-ssrf down -v

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e:web

  web-e2e-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # web/e2e/server/support.ts's ageSignIn edits control.sqlite directly.
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends sqlite3
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: CARGO_TARGET_DIR="$PWD/target" CARGO_INCREMENTAL=0 cargo build --release -p shelfy-server
      # The live AI settings specs launch the deterministic provider. Building
      # shelfy-server alone does not enable the stub's required feature.
      - name: Build the live suite's AI test provider
        run: CARGO_TARGET_DIR="$PWD/target" CARGO_INCREMENTAL=0 cargo build --release --locked -p shelfy-ai --features stub --bin shelfy-ai-stub
      - run: pnpm run web:build
      - run: pnpm run test:e2e:web:server
        env:
          CI: 'true'

  lighthouse:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # web/e2e/lighthouse/run.ts precompresses web/dist the same way the
      # image build does, so the on-the-fly compressor (dev-only) is not what
      # the LCP budget ends up measuring; gzip is already on the runner.
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends brotli
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: CARGO_TARGET_DIR="$PWD/target" CARGO_INCREMENTAL=0 cargo build --release -p shelfy-server
      - run: pnpm run web:build
      - run: pnpm run lighthouse:gallery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 14
