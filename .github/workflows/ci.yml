name: CI

# Runs on every push to main, dev and the web/** integration branches, and on every PR
# into main.
# - test: unit tests + lint + typecheck for the desktop app. This is the status check
#   required by main's branch protection: main only accepts PRs whose CI is green.
#   Mirrors the local pre-push hook (.husky/pre-push) so the cloud gate and the
#   developer's local gate run the same suite.
# - rust: the Cargo workspace (crates/): rustfmt, clippy with warnings as errors, tests
#   and cargo-deny, on the toolchain pinned in rust-toolchain.toml.

on:
  push:
    branches: [main, dev, 'web/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:run
      - run: pnpm exec tsx scripts/golden/run.ts --check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Installs the channel, components and profile pinned in rust-toolchain.toml.
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: EmbarkStudios/cargo-deny-action@v2
