name: Release server

# Tag-driven release of the Shelfy Web server (plan §3.8). Push a tag
# `server-vX.Y.Z` or `server-vX.Y.Z-rc.N` and this:
#
# 1. validate: the tag's X.Y.Z is the workspace version (Cargo.toml). A
#    release candidate is on the integration branch (or main), a plain
#    release on main (P1 assumption G3).
# 2. web: builds the web app (web/dist) the image serves.
# 3. image: builds deploy/docker/shelfy-api.Dockerfile for linux/amd64, pushes
#    ghcr.io/<owner>/shelfy-api:vX.Y.Z[-rc.N] and :sha-<7 hex>, writes its SBOM
#    with syft and signs it with cosign, keyless (GitHub OIDC).
# 4. migrate: builds shelfy-migrate for macOS arm64 and x64, Windows x64 and
#    Linux x64, static with musl (§4.1).
# 5. release: a GitHub release with the shelfy-migrate binaries, the SBOM and
#    SHA256SUMS. Never "Latest": the desktop app's updater reads
#    releases/latest, so a server release is a pre-release (rc) or is created
#    with --latest=false.
#
# Cut a release candidate from the integration branch:
#   git tag server-v0.1.0-rc.1 origin/web/foundations
#   git push origin server-v0.1.0-rc.1
# Verify the image (the release notes give the digest):
#   cosign verify ghcr.io/<owner>/shelfy-api@sha256:<digest> \
#     --certificate-identity-regexp '^https://github.com/<owner>/shelfy/\.github/workflows/release-server\.yml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# Jobs that run third-party build code (npm and cargo build scripts) hold a
# read-only token; only `image`, `egress-image` (packages, id-token) and
# `release` (contents) can write. Actions that run with a write token are
# pinned by commit.
# `egress-image` (P4-02) builds ghcr.io/<owner>/shelfy-egress (Smokescreen with
# the port allowlist, SPIKE-4). P4-13 adds the shelfy-capture image here too.
# Pin SHELFY_EGRESS_VERSION in osn's env to the egress tag you deploy; it moves
# far less often than the API.

on:
  push:
    tags: ['server-v*']

permissions:
  contents: read

concurrency:
  group: release-server-${{ github.ref }}
  cancel-in-progress: false

env:
  INTEGRATION_BRANCH: web/foundations
  IMAGE_NAME: shelfy-api
  EGRESS_IMAGE_NAME: shelfy-egress

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: tag
        name: Check the tag against the workspace version and its branch
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          re='^server-v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$'
          if [[ ! "$tag" =~ $re ]]; then
            echo "::error::$tag is neither server-vX.Y.Z nor server-vX.Y.Z-rc.N"
            exit 1
          fi
          base="${BASH_REMATCH[1]}"
          rc="${BASH_REMATCH[2]}"
          workspace="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [[ "$base" != "$workspace" ]]; then
            echo "::error::$tag does not match the workspace version $workspace (Cargo.toml)"
            exit 1
          fi
          git fetch --quiet origin main
          git fetch --quiet origin "$INTEGRATION_BRANCH" || true
          on() { git merge-base --is-ancestor "$GITHUB_SHA" "origin/$1" 2>/dev/null; }
          if [[ -n "$rc" ]]; then
            if ! on "$INTEGRATION_BRANCH" && ! on main; then
              echo "::error::release candidate $tag must be tagged on $INTEGRATION_BRANCH or main"
              exit 1
            fi
            prerelease=true
          else
            if ! on main; then
              echo "::error::release $tag must be tagged on main"
              exit 1
            fi
            prerelease=false
          fi
          echo "version=${tag#server-}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "ok: $tag, version ${tag#server-}, prerelease $prerelease"

  web:
    name: Web app
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run web:build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 7

  image:
    name: Image (linux/amd64)
    needs: [validate, web]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing
    outputs:
      image: ${{ steps.names.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - id: names
        name: Image name and tags
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          {
            echo "image=$image"
            echo "tags<<EOF"
            echo "$image:$VERSION"
            echo "$image:sha-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The checkout plus the downloaded web/dist, not the Git context.
          context: .
          file: deploy/docker/shelfy-api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=shelfy-api
          cache-to: type=gha,mode=max,scope=shelfy-api
      - name: SBOM (syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: shelfy-api.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (cosign, keyless)
        env:
          IMAGE: ${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: shelfy-api.spdx.json
          if-no-files-found: error
          retention-days: 7

  egress-image:
    name: Egress image (linux/amd64)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing
    outputs:
      image: ${{ steps.names.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - id: names
        name: Image name and tags
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${EGRESS_IMAGE_NAME}"
          {
            echo "image=$image"
            echo "tags<<EOF"
            echo "$image:$VERSION"
            echo "$image:sha-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/shelfy-egress.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=shelfy-egress
          cache-to: type=gha,mode=max,scope=shelfy-egress
      - name: SBOM (syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: shelfy-egress.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (cosign, keyless)
        env:
          IMAGE: ${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-egress
          path: shelfy-egress.spdx.json
          if-no-files-found: error
          retention-days: 7

  migrate:
    name: shelfy-migrate (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: shelfy-migrate-macos-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            asset: shelfy-migrate-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: shelfy-migrate-windows-x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: shelfy-migrate-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
      ASSET: ${{ matrix.asset }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      # The channel pinned in rust-toolchain.toml, plus the target.
      - run: |
          rustup toolchain install --no-self-update
          rustup target add "$TARGET"
      # musl-gcc compiles the bundled C code (SQLite, libwebp, ring) for musl.
      - if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools
      - run: cargo build --release --locked --package shelfy-migrate --target "$TARGET"
      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p out
          suffix=""
          if [[ "$TARGET" == *-windows-* ]]; then suffix=".exe"; fi
          cp "target/$TARGET/release/shelfy-migrate$suffix" "out/$ASSET"
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: migrate-${{ matrix.target }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub release
    needs: [validate, image, egress-image, migrate]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: migrate-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: assets
      - uses: actions/download-artifact@v8
        with:
          name: sbom-egress
          path: assets
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
          EGRESS_IMAGE: ${{ needs.egress-image.outputs.image }}
          EGRESS_DIGEST: ${{ needs.egress-image.outputs.digest }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          cd assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          notes="$(mktemp)"
          {
            echo "Shelfy Web server $VERSION."
            echo
            echo "- Image (linux/amd64): \`$IMAGE:$VERSION\`, digest \`$DIGEST\`, signed with cosign (keyless)."
            echo "- Egress proxy (linux/amd64): \`$EGRESS_IMAGE:$VERSION\`, digest \`$EGRESS_DIGEST\`, signed with cosign (keyless). Pin it as SHELFY_EGRESS_VERSION."
            echo "- \`shelfy-migrate\` for macOS (arm64, x64), Windows (x64) and Linux (x64, static)."
            echo "  It moves a desktop library to the server: deploy/README.md, \"Moving a desktop library\"."
            echo "- \`shelfy-api.spdx.json\`, \`shelfy-egress.spdx.json\`: the images' SBOMs (syft). \`SHA256SUMS\`: checksums of the files."
          } > "$notes"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber -- *
          else
            flags=(--repo "$GITHUB_REPOSITORY" --title "Shelfy Web server $VERSION"
              --notes-file "$notes" --latest=false --verify-tag)
            if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
            gh release create "$tag" "${flags[@]}" -- *
          fi
