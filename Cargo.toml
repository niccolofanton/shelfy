# Cargo workspace for Shelfy Web (docs/web-port/IMPLEMENTATION-PLAN.md §2.4).
# The desktop app (package.json, electron/, src/) is not part of it.

[workspace]
resolver = "3"
members = [
  "crates/ai",
  "crates/core",
  "crates/media",
  "crates/migrate",
  "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/niccolofanton/shelfy"
publish = false

[workspace.dependencies]
# Shared by the workspace crates; a crate opts in with `<name>.workspace = true`.
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
# Request and response bodies of the AI adapters (`shelfy-ai`); already under axum.
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
fast_image_resize = "6.1.0"
# Stream combinators for SSE bodies; the features axum already enables.
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
getrandom = "0.4.3"
# The request and response types of `shelfy-ai`'s transport seam, shared with axum and reqwest.
http = "1.5.0"
http-body-util = "0.1.5"
# `Retry-After` given as an HTTP date, in the outbound client (P2-04).
httpdate = "1.0.3"
# HTTP/1 connections of `shelfy-ai`'s test transport and stub (features `direct`, `stub`).
# The server's outbound HTTP is P2-04's client (L11), not these.
hyper = { version = "1.11.1", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
# No default features: a crate enables only the codecs it decodes (no AVIF, EXR, TIFF…).
image = { version = "0.25.10", default-features = false }
jsonschema = { version = "0.58.4", default-features = false }
# Email (§2.21): SMTP over rustls (ring, webpki roots; no OpenSSL) and the file transport
# behind the dev mailbox. No connection pool: sign-in emails are rare.
lettre = { version = "0.11.23", default-features = false, features = [
  "builder",
  "file-transport",
  "hostname",
  "smtp-transport",
  "tokio1-rustls-tls",
] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
moka = { version = "0.12.16", features = ["sync"] }
# The crypto library under webauthn-rs (passkeys, §2.21). `vendored` compiles OpenSSL from
# source (needs perl and make) and links it statically: the runtime image needs no libssl,
# and cargo-deny's advisories cover the vendored OpenSSL version. The server's tests also use
# it for their software authenticator.
openssl = { version = "0.10.81", features = ["vendored"] }
proptest = "1.11.0"
rayon = "1.12.0"
regex = "1.13.1"
# Outbound HTTP (§2.21, L11): built only in `crates/server/src/outbound/client.rs`. No default
# features: no cookies, no decompression, no system proxy, no bundled crypto provider. The
# client hands reqwest its own rustls configuration (`ring` and the webpki roots, as lettre
# and ureq use), so `rustls-no-provider` adds no second provider. HTTP/2; streamed bodies.
reqwest = { version = "0.13.5", default-features = false, features = [
  "http2",
  "rustls-no-provider",
  "stream",
] }
# No default features: they only add the wasm32 SQLite backend. `cache` is `prepare_cached`.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache"] }
rusqlite_migration = "2.6.0"
# TLS of the outbound client, with `ring`: the provider lettre and ureq already use. Never
# `aws_lc_rs` (a second provider and a C build).
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
# Provider keys and the operator key (§2.15, §7.1): never printed, wiped on drop.
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
# Query strings with repeated keys (`?mediaType=image&mediaType=video`); parsing only.
serde_html_form = { version = "0.4.1", default-features = false, features = ["de", "std"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
thumbhash = "0.1.0"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# TLS for the fixture CDN of the server's tests, with `ring` (see `rustls`).
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-util = "0.7.19"
tower = "0.5.3"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# Blocking HTTP client of `shelfy-migrate`: rustls with ring (the provider lettre already
# brings) and webpki roots, no async runtime in a CLI. The server's own outbound HTTP is
# `reqwest` (§2.21, P2-04).
ureq = { version = "3.4.2", default-features = false, features = ["json", "rustls"] }
url = "2.5.8"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
# Passkeys (§2.11, D8): the passkey-first API. No default features (`attestation`: attested
# passkeys, unused); `conditional-ui` adds the discoverable (username-less) sign-in. The proto
# crate names the option types the server adjusts.
webauthn-rs = { version = "0.5.5", default-features = false, features = ["conditional-ui"] }
webauthn-rs-proto = "0.5.5"
# Mozilla's root certificates, compiled in: the trust store of the outbound client (as of
# lettre and ureq), independent of the image's CA bundle.
webpki-roots = "1.0.9"
# Lossy WebP encoding through libwebp, compiled from source by `libwebp-sys` (needs a C
# compiler). No default features: they only add `image` conversions.
webp = { version = "0.3.1", default-features = false }

[workspace.lints.rust]
# Unsafe code is opt-in per item (`#[allow(unsafe_code)]`) and needs a `// SAFETY:` comment.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"

# Dev and test builds keep line tables only, so backtraces still show file and line. With
# full debug info, each worktree's target dir grew to 5–7 GB, most of it in the
# integration-test binaries.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
