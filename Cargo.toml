# Cargo workspace for Shelfy Web (docs/web-port/IMPLEMENTATION-PLAN.md §2.4).
# The desktop app (package.json, electron/, src/) is not part of it.

[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/media",
  "crates/migrate",
  "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/niccolofanton/shelfy"
publish = false

[workspace.lints.rust]
# Unsafe code is opt-in per item (`#[allow(unsafe_code)]`) and needs a `// SAFETY:` comment.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"
