# Cargo workspace for Shelfy Web (docs/web-port/IMPLEMENTATION-PLAN.md §2.4).
# The desktop app (package.json, electron/, src/) is not part of it.

[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/media",
  "crates/migrate",
  "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/niccolofanton/shelfy"
publish = false

[workspace.dependencies]
# Shared by the workspace crates; a crate opts in with `<name>.workspace = true`.
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
moka = { version = "0.12.16", features = ["sync"] }
proptest = "1.11.0"
regex = "1.13.1"
# No default features: they only add the wasm32 SQLite backend. `cache` is `prepare_cached`.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
url = "2.5.8"

[workspace.lints.rust]
# Unsafe code is opt-in per item (`#[allow(unsafe_code)]`) and needs a `// SAFETY:` comment.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"
