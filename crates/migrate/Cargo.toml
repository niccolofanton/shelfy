[package]
name = "shelfy-migrate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["env"] }
# `backup`: a library with a `-wal` file is copied with the online backup API before
# `run` reads it (OI-8).
rusqlite = { workspace = true, features = ["backup"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shelfy-core = { path = "../core" }
# The media type allowlist and digests, so the bundle names its objects as the server does.
shelfy-media = { path = "../media" }
thiserror.workspace = true
ureq.workspace = true

[target.'cfg(unix)'.dependencies]
# `F_GETLK`: whether the desktop app holds its library open (`desktop.rs`). Already in
# Cargo.lock through tokio and getrandom: no new crate.
libc = "0.2.189"

[dev-dependencies]
# Decodable synthetic images for the synthetic desktop library (`examples/synth_desktop.rs`).
image = { workspace = true, features = ["jpeg", "png"] }
tempfile.workspace = true

[lints]
workspace = true
