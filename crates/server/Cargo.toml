[package]
name = "shelfy-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
secrecy.workspace = true
zeroize.workspace = true
clap = { workspace = true, features = ["env"] }
futures-util.workspace = true
fs2 = "0.4.3"
getrandom.workspace = true
httpdate.workspace = true
lettre.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
moka.workspace = true
# Enables `vendored` for webauthn-rs's OpenSSL (see the workspace manifest); the tests' software
# authenticator signs with it.
openssl.workspace = true
# Scrubbing the free text of client error reports before it is logged.
regex.workspace = true
# Outbound HTTP, built only in `src/outbound/client.rs` (L11).
reqwest.workspace = true
# `backup`: the SQLite online backup API behind `admin snapshot`.
rusqlite = { workspace = true, features = ["backup"] }
# The TLS configuration of the outbound client (`ring`, webpki roots).
rustls.workspace = true
serde.workspace = true
serde_html_form.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The AI providers' adapters (P3-01); `outbound::ai` is their transport.
shelfy-ai = { path = "../ai" }
shelfy-core = { path = "../core" }
shelfy-media = { path = "../media" }
thiserror.workspace = true
# `fs`, `io-util` and tokio-util's `io`: media files are streamed from disk.
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-util = { workspace = true, features = ["io"] }
# `util`: the web app's fallback service (`service_fn`, `oneshot`, boxed).
tower = { workspace = true, features = ["util"] }
# `fs`: the web app's files, with their precompressed siblings (`ServeDir`).
tower-http = { workspace = true, features = [
  "catch-panic",
  "compression-br",
  "compression-gzip",
  "fs",
  "limit",
  "timeout",
] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
webauthn-rs.workspace = true
webauthn-rs-proto.workspace = true
webpki-roots.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2", "deflate-flate2-zlib-rs"] }

[features]
# Tests only (F15): `Egress::loopback_for_tests` and `AiTransport::with_loopback_for_tests`
# reach a loopback `shelfy-ai-stub` through `Purpose::Ai`. Only the dev-dependency below turns
# it on; release builds (`cargo build -p shelfy-server`) never do.
test-loopback = []

[dev-dependencies]
http-body-util.workspace = true
# Decodable synthetic images for the migration tests.
image = { workspace = true, features = ["jpeg", "png"] }
jsonschema.workspace = true
proptest.workspace = true
# The test AI provider, behind the outbound client in the AI transport tests.
shelfy-ai = { path = "../ai", features = ["stub"] }
# The crate itself with the test-only loopback route, so that `cargo test` reaches it.
shelfy-server = { path = ".", features = ["test-loopback"] }
# The migration CLI, run end to end against the server in the migration tests.
shelfy-migrate = { path = "../migrate" }
tempfile.workspace = true
# The fixture CDN's TLS (`tests/support/cdn.rs`).
tokio-rustls.workspace = true
# `test-util`: paused time for the SSE heartbeat test.
tokio = { workspace = true, features = ["io-util", "test-util"] }
tower = { workspace = true, features = ["util"] }
# HTTP to a running server, in the ignored live passkey test.
ureq.workspace = true

[lints]
workspace = true
