[package]
name = "shelfy-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["env"] }
futures-util.workspace = true
getrandom.workspace = true
lettre.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
moka.workspace = true
# `backup`: the SQLite online backup API behind `admin snapshot`.
rusqlite = { workspace = true, features = ["backup"] }
serde.workspace = true
serde_html_form.workspace = true
serde_json.workspace = true
sha2.workspace = true
shelfy-core = { path = "../core" }
shelfy-media = { path = "../media" }
thiserror.workspace = true
# `fs`, `io-util` and tokio-util's `io`: media files are streamed from disk.
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-util = { workspace = true, features = ["io"] }
tower.workspace = true
tower-http = { workspace = true, features = [
  "catch-panic",
  "compression-br",
  "compression-gzip",
  "limit",
  "timeout",
] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

[dev-dependencies]
http-body-util.workspace = true
jsonschema.workspace = true
proptest.workspace = true
tempfile.workspace = true
# `test-util`: paused time for the SSE heartbeat test.
tokio = { workspace = true, features = ["io-util", "test-util"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
