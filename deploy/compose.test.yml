# Test stack for Shelfy Web (plan §3.8): shelfy-api from a local image, on its
# own data, configured like production (§3.2) but reached on the loopback.
# P1-21 runs the web e2e suite on it. The mock AI provider, the fixture CDN
# and Smokescreen (allowing only the fixture subnet) join in P2–P4.
#
#   pnpm run web:build
#   docker build -f deploy/docker/shelfy-api.Dockerfile -t shelfy-api:local .
#   docker compose -f deploy/compose.test.yml up -d --wait
#   curl http://127.0.0.1:8081/health
#   deploy/restart-check.sh          # a restart is healthy again within 3 s
#   docker compose -f deploy/compose.test.yml exec shelfy-api \
#     /app/shelfy-server admin create-owner --email owner@example.test
#   docker compose -f deploy/compose.test.yml exec shelfy-api \
#     /app/shelfy-server admin login-link --email owner@example.test
#   docker compose -f deploy/compose.test.yml down -v      # -v drops the data
#
# Settings, from the environment of `docker compose`:
#
#   SHELFY_TEST_IMAGE  the image (default shelfy-api:local). It is never
#                      pulled: build it, or `docker pull` a release first.
#   SHELFY_TEST_PORT   the API's loopback port (default 8081). The public URL
#                      is http://localhost:<port>: open the app there.
#   SHELFY_TEST_DATA   the data: the named volume shelfy-test-data (default),
#                      or an absolute host path for a bind mount. On Linux a
#                      host path must be writable by uid 10100.
#
# Email is optional (E4). By default sign-in emails land as .eml files in
# /data/shelfy/dev-mailbox/ (the dev mailbox). To catch them in mailpit
# instead (web UI on http://127.0.0.1:8025):
#
#   SHELFY_TEST_DEV_MAILBOX=false SHELFY_TEST_SMTP_HOST=mailpit:1025 \
#     docker compose -f deploy/compose.test.yml --profile mail up -d --wait
#
# Differences from production: the API is published on the loopback, emails
# stay local, and no edge, tunnel or monitoring sits in front.

name: shelfy-test

services:
  shelfy-api:
    image: ${SHELFY_TEST_IMAGE:-shelfy-api:local}
    pull_policy: never
    restart: unless-stopped
    user: '10100:10100'
    read_only: true
    tmpfs: ['/tmp:size=256m,mode=1777']
    environment:
      SHELFY_PUBLIC_URL: http://localhost:${SHELFY_TEST_PORT:-8081}
      SHELFY_DATA_DIR: /data/shelfy
      SHELFY_DEV_MAILBOX: ${SHELFY_TEST_DEV_MAILBOX:-true}
      SHELFY_SMTP_HOST: ${SHELFY_TEST_SMTP_HOST:-}
      SHELFY_SMTP_TLS: none # only used with SHELFY_TEST_SMTP_HOST: mailpit takes plain SMTP
      SHELFY_SMTP_FROM: Shelfy <shelfy@example.test>
      RUST_LOG: ${SHELFY_TEST_RUST_LOG:-info}
    volumes:
      - ${SHELFY_TEST_DATA:-shelfy-test-data}:/data/shelfy
    ports:
      # The API, on the loopback only.
      - '127.0.0.1:${SHELFY_TEST_PORT:-8081}:8080'
    # Metrics stay unpublished: as on the VPS, only the compose network
    # reaches :9464.
    expose:
      - '9464'
    mem_limit: 768m
    memswap_limit: 1g
    cpus: 1.5
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', '/app/shelfy-server', 'healthcheck']
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

  mailpit:
    profiles: [mail]
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    restart: unless-stopped
    ports:
      - '127.0.0.1:${SHELFY_TEST_MAILPIT_PORT:-8025}:8025'

  # --- SSRF suite (profile `ssrf`, P4-02; plan §6.1, SPIKE-4) ---------------
  #
  # The egress proxy in production configuration plus `--allow-range` for the
  # fixture subnet, a CoreDNS test resolver that answers inward and the
  # fixtures, and an nginx fixture/redirect origin on the allowed subnet. The
  # `ssrf` job (.github/workflows/ci.yml) builds shelfy-egress:local, brings
  # this profile up and runs `cargo test -p shelfy-server --test ssrf` with
  # SHELFY_SSRF_PROXY pointing at the published proxy; every probe is refused.
  # P4-03/P4-13 reuse shelfy-ssrf-egress for the capture stack (union at rebase).
  #
  #   docker build -f deploy/docker/shelfy-egress.Dockerfile -t shelfy-egress:local .
  #   docker compose -f deploy/compose.test.yml --profile ssrf up -d --wait
  #   SHELFY_SSRF_PROXY=http://127.0.0.1:4750 cargo test -p shelfy-server --test ssrf -- --nocapture
  #   docker compose -f deploy/compose.test.yml --profile ssrf down -v

  shelfy-ssrf-resolver:
    profiles: [ssrf]
    image: coredns/coredns:1.12.0@sha256:40384aa1f5ea6bfdc77997d243aec73da05f27aed0c5e9d65bfa98933c519d97
    restart: unless-stopped
    command: ['-conf', '/etc/coredns/Corefile']
    volumes:
      - ./egress/ssrf/Corefile:/etc/coredns/Corefile:ro
      - ./egress/ssrf/hosts:/etc/coredns/hosts:ro
    networks:
      shelfy-ssrf:
        ipv4_address: 10.133.0.2
    mem_limit: 64m
    # An ephemeral test resolver that binds :53: its binary carries a file
    # capability, so `no-new-privileges` with `cap_drop: ALL` would make exec
    # fail. It is the one container here that keeps the default capabilities.

  shelfy-ssrf-fixture:
    profiles: [ssrf]
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    volumes:
      - ./egress/ssrf/fixture.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      shelfy-ssrf:
        ipv4_address: 10.133.0.10
    mem_limit: 64m
    security_opt: ['no-new-privileges:true']
    healthcheck:
      # nginx's fixture listens on IPv4. On IPv6-enabled CI hosts BusyBox
      # wget resolves localhost to ::1 and does not fall back after refusal.
      test: ['CMD', 'wget', '-q', '-O-', 'http://127.0.0.1/']
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

  shelfy-ssrf-egress:
    profiles: [ssrf]
    image: ${SHELFY_EGRESS_TEST_IMAGE:-shelfy-egress:local}
    pull_policy: never
    restart: unless-stopped
    user: '10101:10101'
    read_only: true
    # Production arguments (config.yaml + acl.yaml) plus the one test-only flag:
    # the fixture subnet is allowed so the positive controls have somewhere to
    # reach. Production adds --deny-range for the VPS's own addresses instead
    # (deploy/egress/README.md); it never adds --allow-range.
    command:
      - --config-file=/etc/shelfy-egress/config.yaml
      - --allow-range=10.133.0.0/24
    volumes:
      - ./egress/config.yaml:/etc/shelfy-egress/config.yaml:ro
      - ./egress/acl.yaml:/etc/shelfy-egress/acl.yaml:ro
    # The proxy's only resolver is the test CoreDNS: unlisted names get NXDOMAIN.
    dns: ['10.133.0.2']
    ports:
      # The proxy on the loopback, for `cargo test --test ssrf`. Not published
      # in production: only the capture network reaches it there.
      - '127.0.0.1:${SHELFY_SSRF_PORT:-4750}:4750'
    networks:
      shelfy-ssrf:
        ipv4_address: 10.133.0.3
    mem_limit: 96m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on:
      shelfy-ssrf-resolver:
        condition: service_started
      shelfy-ssrf-fixture:
        condition: service_healthy

volumes:
  shelfy-test-data:

networks:
  # A fixed subnet so the resolver and the fixtures have stable addresses and
  # the proxy can allow exactly that range. Not `internal`: the proxy's policy,
  # not the network, is what the suite exercises (capture-network isolation is
  # P4-13). The private 10.133.0.0/24 is inside the proxy's 10.0.0.0/8 deny
  # range, so only `--allow-range` lets the fixtures through.
  shelfy-ssrf:
    driver: bridge
    ipam:
      config:
        - subnet: 10.133.0.0/24
