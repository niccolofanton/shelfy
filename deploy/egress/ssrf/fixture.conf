# nginx fixture origin for the SSRF suite (deploy/egress/ssrf, plan §6.1). It
# sits on the allowed subnet and plays two roles:
#  - the positive control: GET / answers 200, so category A proves a permitted
#    destination still gets through (and :443 accepts TCP for the CONNECT control);
#  - the redirect origin (category F): an allowed origin that 302s to a private
#    target, which the outbound client and the proxy must refuse at the hop.
server {
    listen 80 default_server;
    listen 443 default_server;
    server_name _;

    location = / {
        add_header Content-Type text/plain;
        return 200 "shelfy ssrf fixture ok\n";
    }

    # Redirects to destinations that must be refused when followed.
    location = /to-private-name {
        return 302 http://metadata.fixture.test/;
    }
    location = /to-private-literal {
        return 302 http://10.0.0.1/;
    }
    location = /to-metadata-literal {
        return 302 http://169.254.169.254/latest/meta-data/;
    }

    location / {
        return 404;
    }
}
