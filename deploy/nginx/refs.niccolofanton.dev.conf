# Edge route of Shelfy Web on the osn VPS (plan §2.4, §3.3; E5).
#
# The `log_format` and the `server` block below sit in the `http` block of the
# osn edge nginx (osn edge/nginx.conf), which holds the live copy: keep the
# two identical. The chain is Cloudflare (TLS, Access) -> tunnel ->
# cloudflared on the host -> this edge on 127.0.0.1:80 -> shelfy-api:8080 on
# the compose network `edge`, whose subnet is pinned so that shelfy-api trusts
# CF-Connecting-IP from it only (SHELFY_TRUSTED_PROXIES).
#
# What the app needs from the edge:
# - Request headers passed through, CF-Connecting-IP included (nginx forwards
#   them by default).
# - No compression: the app sends brotli or gzip itself, with Vary.
# - No buffering: SSE events (/api/v1/events) reach the client at once (the
#   app also sends X-Accel-Buffering: no), uploads stream to the app, and
#   large media never spill into temporary files inside the edge container.
# - Long read and send timeouts: SSE streams stay open, with a heartbeat
#   every 20 s.
# - Bodies up to 32 MiB: tus chunks are 16 MiB, speech-to-text uploads 25 MiB
#   (§2.3).
# - No query strings or referrers in the access log (§3.7). The log goes to
#   the container's stdout, rotated by Docker (`just logs edge` in osn).
#
# Cloudflare must not add HSTS for this host: the app sends it (§3.3, P1-09).

log_format edge_refs '$remote_addr - $host "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80;
    server_name refs.niccolofanton.dev;

    client_max_body_size 32m;
    access_log /dev/stdout edge_refs;
    gzip off;

    location / {
        # `set` + variable: runtime DNS resolution, so the edge starts (and
        # answers 502) while shelfy-api is down or not deployed yet.
        set $upstream_shelfy "http://shelfy-api:8080";
        proxy_pass $upstream_shelfy;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
