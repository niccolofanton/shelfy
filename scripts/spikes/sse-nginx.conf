# SPIKE-10 nginx: mirrors the osn edge (`/opt/osn/stack/edge/nginx.conf`) with
# the Shelfy server block of plan §3.3. Only the hostnames differ: the spike is
# reached through a Cloudflare quick tunnel (*.trycloudflare.com), or directly
# as `shelfy-spike-nginx` from a container on the spike network.
#
# Like the edge, nothing here disables proxy buffering: the app turns it off
# per response with `X-Accel-Buffering: no`.

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    log_format edge '$remote_addr - $host "$request" $status '
                    '$body_bytes_sent "$http_user_agent" rt=$request_time';
    access_log /dev/stdout edge;

    server_tokens off;

    server {
        listen 80;
        server_name .trycloudflare.com shelfy-spike-nginx;
        client_max_body_size 20m;

        location / {
            set $upstream_shelfy "http://shelfy-spike-sse:8080";
            proxy_pass $upstream_shelfy;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    server {
        listen 80 default_server;
        server_name _;
        return 503;
    }
}
