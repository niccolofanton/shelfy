<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: Chrome for Android shrinks the layout when the
         keyboard opens, so a focused field stays visible (iOS ignores it). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- <html lang> from the saved language, before the app runs (the default
         language is Italian; React keeps it in sync afterwards). -->
    <script src="/lang.js"></script>
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <!-- The web app manifest (plan §2.17, §2.19; P1-02, P1-24, P2-07: the
         share target and the service worker). SPIKE-8 (P1-24) needs the iOS
         home-screen app meta tags below regardless of the manifest. The
         service worker itself (web/src/sw.ts) registers from main.tsx, not
         from a tag here — vite-plugin-pwa's `injectRegister` detects that
         self-registration and adds none of its own. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shelfy" />
    <title>Shelfy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
